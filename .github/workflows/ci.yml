name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.x
          - 26.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check public API reports
        run: pnpm api:check

      - name: Generate API reference
        run: pnpm docs:api

      - name: Upload API reference
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: docs/api
          retention-days: 14

      - name: Format
        run: pnpm format

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build the server image
        run: docker build --tag sinterdb-local .

      - name: Check the Compose file
        run: docker compose --file examples/docker/compose.yaml config --quiet

      - name: Write, stop, restart and read back
        working-directory: packages/driver
        env:
          SINTERDB_DOCKER_IMAGE: sinterdb-local
        run: pnpm exec vitest run src/docker.integration.test.ts
